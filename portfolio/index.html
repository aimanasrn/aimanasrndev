<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        try {
          var saved = localStorage.getItem("theme")
          var dark =
            saved === "dark" ||
            ((!saved || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add(dark ? "dark" : "light")
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Muhammad Aiman — software developer building modern web products and enterprise systems. Explore selected work, experience, and development capabilities." />
    <title>Muhammad Aiman — Software Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
